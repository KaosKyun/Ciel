# CI principale — validation du plugin Ciel
# Déclencheur: push sur main + PR

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-hooks:
    name: Lint Hooks (ShellCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          shellcheck --version
          echo "Running ShellCheck on hooks (errors only, warnings allowed)..."
          failed=0
          for dir in hooks .claude/hooks; do
            for file in "$dir"/*.sh; do
              if [ -f "$file" ]; then
                echo "Checking $file..."
                shellcheck "$file" || {
                  exit_code=$?
                  if [ $exit_code -ge 2 ]; then
                    echo "✗ $file has errors"
                    failed=1
                  else
                    echo "⚠ $file has warnings (allowed)"
                  fi
                }
              fi
            done
          done
          if [ $failed -eq 1 ]; then
            echo "✗ Some hooks have ShellCheck errors"
            exit 1
          fi
          echo "✓ All hooks passed ShellCheck"

  test-ciel:
    name: Test Ciel (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .opencode/package-lock.json

      - name: Install dependencies
        working-directory: .opencode
        run: npm ci

      - name: Run tests
        run: |
          if [ -f .opencode/test-ciel.ts ]; then
            echo "Running Ciel v5 test suite..."
            npx tsx .opencode/test-ciel.ts
          else
            echo "ERROR: .opencode/test-ciel.ts not found"
            exit 1
          fi

  validate-config:
    name: Validate Config (jq)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate opencode.json
        run: |
          echo "Validating opencode.json..."
          jq '.' opencode.json > /dev/null && echo "✓ opencode.json is valid JSON"
          
      - name: Validate agent definitions
        run: |
          echo "Checking OpenCode agent files exist..."
          for agent in ciel ciel-researcher ciel-explorer ciel-critic ciel-improver; do
            if [ -f ".opencode/agents/${agent}.md" ]; then
              echo "✓ .opencode/agents/${agent}.md exists"
            else
              echo "✗ .opencode/agents/${agent}.md missing"
              exit 1
            fi
          done

          echo "Checking Claude Code agent files exist..."
          for agent in ciel-researcher ciel-explorer ciel-critic ciel-improver; do
            if [ -f ".claude/agents/${agent}.md" ]; then
              echo "✓ .claude/agents/${agent}.md exists"
            else
              echo "✗ .claude/agents/${agent}.md missing"
              exit 1
            fi
          done

          echo "Checking Claude Code hook files exist..."
          for hook in check-test-first block-destructive track-file meta-critiquer; do
            if [ -f ".claude/hooks/${hook}.sh" ]; then
              echo "✓ .claude/hooks/${hook}.sh exists"
            else
              echo "✗ .claude/hooks/${hook}.sh missing"
              exit 1
            fi
          done

  validate-agent-permissions:
    name: Validate Agent Permissions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check OpenCode agent tool permissions
        run: |
          echo "=== Checking OpenCode Agent Tool Permissions ==="
          failed=0

          # Helper: check that a tool is allowed for an agent
          check_perm() {
            local agent="$1" tool="$2"
            if grep -q "^  ${tool}:" ".opencode/agents/${agent}.md"; then
              local val
              val=$(grep "^  ${tool}:" ".opencode/agents/${agent}.md" | sed 's/.*: //')
              if [ "$val" = "false" ]; then
                echo "✗ .opencode/agents/${agent}.md: ${tool}=false (should be true)"
                return 1
              fi
              echo "✓ .opencode/agents/${agent}.md: ${tool}=${val}"
            fi
            return 0
          }

          # ciel-researcher needs bash (npm/curl for version checks) + webfetch + websearch
          check_perm "ciel-researcher" "bash" || failed=1
          check_perm "ciel-researcher" "webfetch" || failed=1
          check_perm "ciel-researcher" "websearch" || failed=1

          # ciel-explorer needs bash (git blame/log) + read + grep + glob
          check_perm "ciel-explorer" "bash" || failed=1
          check_perm "ciel-explorer" "read" || failed=1
          check_perm "ciel-explorer" "grep" || failed=1

          # ciel-critic needs bash + read + grep + glob
          check_perm "ciel-critic" "bash" || failed=1
          check_perm "ciel-critic" "read" || failed=1

          # ciel-improver needs write + edit + bash + webfetch + websearch
          check_perm "ciel-improver" "write" || failed=1
          check_perm "ciel-improver" "edit" || failed=1
          check_perm "ciel-improver" "bash" || failed=1
          check_perm "ciel-improver" "webfetch" || failed=1
          check_perm "ciel-improver" "websearch" || failed=1

          if [ "$failed" -eq 1 ]; then
            echo "✗ Some agents have incorrect tool permissions"
            exit 1
          fi
          echo "✓ All OpenCode agents have correct tool permissions"

      - name: Check Claude Code agent model fields removed
        run: |
          echo "=== Checking Claude Code Agent Definitions ==="
          failed=0
          for agent in ciel-researcher ciel-explorer ciel-critic ciel-improver; do
            file=".claude/agents/${agent}.md"
            if [ ! -f "$file" ]; then
              echo "✗ $file missing"
              failed=1
              continue
            fi
            if grep -q "^model:" "$file"; then
              echo "✗ $file still has 'model:' field (causes ProviderModelNotFoundError)"
              failed=1
            else
              echo "✓ $file: no model field (clean)"
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "✓ All Claude Code agents have no model field"

  validate-hook-env-vars:
    name: Validate Hook Env Vars
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for env var typos in hooks
        run: |
          echo "=== Checking for env var typos in hooks ==="
          failed=0

          # Check .claude/hooks/ for CLAUD_PROJECT_DIR (typo — missing E)
          for file in .claude/hooks/*.sh hooks/*.sh; do
            if [ ! -f "$file" ]; then continue; fi
            if grep -q 'CLAUD_PROJECT_DIR' "$file"; then
              echo "✗ $file: contains CLAUD_PROJECT_DIR (typo — should be CLAUDE_PROJECT_DIR)"
              failed=1
            fi
          done

          # Check all hook files use $CLAUDE_PROJECT_DIR (not hardcoded paths)
          for file in .claude/hooks/*.sh; do
            if [ ! -f "$file" ]; then continue; fi
            # Allow shebang and comments, check for hardcoded /Users/ or /home/ paths
            hardcoded=$(grep -c '/Users/\|/home/' "$file" 2>/dev/null || true)
            if [ "$hardcoded" -gt 0 ]; then
              echo "⚠ $file: has hardcoded paths (use \$CLAUDE_PROJECT_DIR instead)"
            fi
          done

          echo "✓ All env vars checked"

          if [ "$failed" -eq 1 ]; then exit 1; fi

  validate-agent-parity:
    name: Validate Agent Parity (OpenCode ↔ Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check agent parity between OpenCode and Claude Code
        run: |
          echo "=== Checking Agent Parity ==="
          failed=0

          # Claude Code agents (without ciel.md — it's OpenCode-only orchestrator)
          CLAUDE_AGENTS="ciel-researcher ciel-explorer ciel-critic ciel-improver"

          # OpenCode subagents (without ciel.md — it's the orchestrator)
          OPENCODE_AGENTS="ciel-researcher ciel-explorer ciel-critic ciel-improver"

          # Check each agent exists in both harnesses
          for agent in ciel-researcher ciel-explorer ciel-critic ciel-improver; do
            if [ ! -f ".opencode/agents/${agent}.md" ]; then
              echo "✗ .opencode/agents/${agent}.md missing"
              failed=1
            fi
            if [ ! -f ".claude/agents/${agent}.md" ]; then
              echo "✗ .claude/agents/${agent}.md missing"
              failed=1
            fi
          done

          # Check that agent descriptions are present in both
          for agent in $CLAUDE_AGENTS; do
            oc_desc=$(grep "^description:" ".opencode/agents/${agent}.md" 2>/dev/null | head -1)
            cc_desc=$(grep "^description:" ".claude/agents/${agent}.md" 2>/dev/null | head -1)
            if [ -z "$oc_desc" ]; then
              echo "⚠ .opencode/agents/${agent}.md: missing description"
            fi
            if [ -z "$cc_desc" ]; then
              echo "⚠ .claude/agents/${agent}.md: missing description"
            fi
          done

          echo "✓ Agent parity check complete"
          if [ "$failed" -eq 1 ]; then exit 1; fi

  validate-byte-limits:
    name: Validate Byte Limits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .opencode/package-lock.json

      - name: Install dependencies
        working-directory: .opencode
        run: npm ci

      - name: Build platforms
        run: |
          echo "Building platforms for validation..."
          chmod +x scripts/build-platforms.sh
          ./scripts/build-platforms.sh --target=all

      - name: Validate byte limits
        run: |
          echo "=== Validating byte limits ==="
          
          # Cursor: ≤6KB
          if [ -f "platforms/cursor/.cursor/rules/ciel.mdc" ]; then
            size=$(wc -c < "platforms/cursor/.cursor/rules/ciel.mdc")
            if [ "$size" -le 6144 ]; then
              echo "✓ Cursor: $size bytes (≤6144)"
            else
              echo "✗ Cursor: $size bytes exceeds 6144 limit"
              exit 1
            fi
          fi
          
          # Windsurf rules: ≤6KB each
          if [ -d "platforms/windsurf/.windsurf/rules" ]; then
            for f in platforms/windsurf/.windsurf/rules/*.md; do
              if [ -f "$f" ]; then
                size=$(wc -c < "$f")
                if [ "$size" -le 6144 ]; then
                  echo "✓ Windsurf $(basename $f): $size bytes (≤6144)"
                else
                  echo "✗ Windsurf $(basename $f): $size bytes exceeds 6144 limit"
                  exit 1
                fi
              fi
            done
          fi
          
          # Codex AGENTS.md: ≤32KB
          if [ -f "platforms/codex/AGENTS.md" ]; then
            size=$(wc -c < "platforms/codex/AGENTS.md")
            if [ "$size" -le 32768 ]; then
              echo "✓ Codex AGENTS.md: $size bytes (≤32768)"
            else
              echo "✗ Codex AGENTS.md: $size bytes exceeds 32768 limit"
              exit 1
            fi
          fi
          
          # OpenCode plugin: ≤65KB
          if [ -f "platforms/opencode/.opencode/plugins/ciel.ts" ]; then
            size=$(wc -c < "platforms/opencode/.opencode/plugins/ciel.ts")
            if [ "$size" -le 65536 ]; then
              echo "✓ OpenCode plugin: $size bytes (≤65536)"
            else
              echo "✗ OpenCode plugin: $size bytes exceeds 65536 limit"
              exit 1
            fi
          fi
          
          # Kilocode: ≤6KB
          if [ -f "platforms/kilocode/.kilocode/rules/ciel.md" ]; then
            size=$(wc -c < "platforms/kilocode/.kilocode/rules/ciel.md")
            if [ "$size" -le 6144 ]; then
              echo "✓ Kilocode: $size bytes (≤6144)"
            else
              echo "✗ Kilocode: $size bytes exceeds 6144 limit"
              exit 1
            fi
          fi
          
          echo "=== All byte limits validated ==="

  build-check:
    name: Build Check (Dry Run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Run build-platforms.sh --dry-run
        run: |
          if [ -f scripts/build-platforms.sh ]; then
            chmod +x scripts/build-platforms.sh
            echo "Running build-platforms.sh --dry-run..."
            ./scripts/build-platforms.sh --dry-run || echo "Dry run completed (exit code: $?)"
          else
            echo "scripts/build-platforms.sh not found, skipping..."
          fi
