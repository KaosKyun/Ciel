# CI principale — validation du plugin Ciel
# Déclencheur: push sur main + PR

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-hooks:
    name: Lint Hooks (ShellCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          shellcheck --version
          echo "Running ShellCheck on hooks (errors only, warnings allowed)..."
          failed=0
          for dir in hooks .claude/hooks; do
            for file in "$dir"/*.sh; do
              if [ -f "$file" ]; then
                echo "Checking $file..."
                shellcheck "$file" || {
                  exit_code=$?
                  if [ $exit_code -ge 2 ]; then
                    echo "✗ $file has errors"
                    failed=1
                  else
                    echo "⚠ $file has warnings (allowed)"
                  fi
                }
              fi
            done
          done
          if [ $failed -eq 1 ]; then
            echo "✗ Some hooks have ShellCheck errors"
            exit 1
          fi
          echo "✓ All hooks passed ShellCheck"

  test-ciel:
    name: Test Ciel (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .opencode/package-lock.json

      - name: Install dependencies
        working-directory: .opencode
        run: npm ci

      - name: Run tests
        run: |
          if [ -f .opencode/test-ciel.ts ]; then
            echo "Running Ciel v5 test suite..."
            npx tsx .opencode/test-ciel.ts
          else
            echo "ERROR: .opencode/test-ciel.ts not found"
            exit 1
          fi

  validate-config:
    name: Validate Config (jq)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate opencode.json
        run: |
          echo "Validating opencode.json..."
          jq '.' opencode.json > /dev/null && echo "✓ opencode.json is valid JSON"
          
      - name: Validate agent definitions
        run: |
          echo "Checking OpenCode agent files exist..."
          for agent in ciel ciel-researcher ciel-explorer ciel-critic ciel-improver; do
            if [ -f ".opencode/agents/${agent}.md" ]; then
              echo "✓ .opencode/agents/${agent}.md exists"
            else
              echo "✗ .opencode/agents/${agent}.md missing"
              exit 1
            fi
          done

          echo "Checking Claude Code agent files exist..."
          for agent in ciel-researcher ciel-explorer ciel-critic ciel-improver; do
            if [ -f ".claude/agents/${agent}.md" ]; then
              echo "✓ .claude/agents/${agent}.md exists"
            else
              echo "✗ .claude/agents/${agent}.md missing"
              exit 1
            fi
          done

          echo "Checking Ciel hook files exist (canonical hooks/ — .claude/hooks/ is gitignored)..."
          for hook in block-destructive track-file track-verification check-dispatch-gate pre-agent-gate pre-tool-write stop session-start user-prompt-submit memory-bootstrap; do
            if [ -f "hooks/${hook}.sh" ]; then
              echo "✓ hooks/${hook}.sh exists"
            else
              echo "✗ hooks/${hook}.sh missing"
              exit 1
            fi
          done

  validate-agent-permissions:
    name: Validate Agent Permissions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check OpenCode agent tool permissions
        run: |
          echo "=== Checking OpenCode Agent Tool Permissions ==="
          failed=0

          # Helper: check that a tool is allowed for an agent
          check_perm() {
            local agent="$1" tool="$2"
            if grep -q "^  ${tool}:" ".opencode/agents/${agent}.md"; then
              local val
              val=$(grep "^  ${tool}:" ".opencode/agents/${agent}.md" | sed 's/.*: //')
              if [ "$val" = "false" ]; then
                echo "✗ .opencode/agents/${agent}.md: ${tool}=false (should be true)"
                return 1
              fi
              echo "✓ .opencode/agents/${agent}.md: ${tool}=${val}"
            fi
            return 0
          }

          # ciel-researcher needs bash (npm/curl for version checks) + webfetch + websearch
          check_perm "ciel-researcher" "bash" || failed=1
          check_perm "ciel-researcher" "webfetch" || failed=1
          check_perm "ciel-researcher" "websearch" || failed=1

          # ciel-explorer needs bash (git blame/log) + read + grep + glob
          check_perm "ciel-explorer" "bash" || failed=1
          check_perm "ciel-explorer" "read" || failed=1
          check_perm "ciel-explorer" "grep" || failed=1

          # ciel-critic needs bash + read + grep + glob
          check_perm "ciel-critic" "bash" || failed=1
          check_perm "ciel-critic" "read" || failed=1

          # ciel-improver needs write + edit + bash + webfetch + websearch
          check_perm "ciel-improver" "write" || failed=1
          check_perm "ciel-improver" "edit" || failed=1
          check_perm "ciel-improver" "bash" || failed=1
          check_perm "ciel-improver" "webfetch" || failed=1
          check_perm "ciel-improver" "websearch" || failed=1

          if [ "$failed" -eq 1 ]; then
            echo "✗ Some agents have incorrect tool permissions"
            exit 1
          fi
          echo "✓ All OpenCode agents have correct tool permissions"

      - name: Check Claude Code agent model fields removed
        run: |
          echo "=== Checking Claude Code Agent Definitions ==="
          failed=0
          for agent in ciel-researcher ciel-explorer ciel-critic ciel-improver; do
            file=".claude/agents/${agent}.md"
            if [ ! -f "$file" ]; then
              echo "✗ $file missing"
              failed=1
              continue
            fi
            if grep -q "^model:" "$file"; then
              echo "✗ $file still has 'model:' field (causes ProviderModelNotFoundError)"
              failed=1
            else
              echo "✓ $file: no model field (clean)"
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "✓ All Claude Code agents have no model field"

  validate-hook-env-vars:
    name: Validate Hook Env Vars
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for env var typos in hooks
        run: |
          echo "=== Checking for env var typos in hooks ==="
          failed=0

          # Check .claude/hooks/ for CLAUD_PROJECT_DIR (typo — missing E)
          for file in .claude/hooks/*.sh hooks/*.sh; do
            if [ ! -f "$file" ]; then continue; fi
            if grep -q 'CLAUD_PROJECT_DIR' "$file"; then
              echo "✗ $file: contains CLAUD_PROJECT_DIR (typo — should be CLAUDE_PROJECT_DIR)"
              failed=1
            fi
          done

          # Check all hook files use $CLAUDE_PROJECT_DIR (not hardcoded paths)
          for file in .claude/hooks/*.sh; do
            if [ ! -f "$file" ]; then continue; fi
            # Allow shebang and comments, check for hardcoded /Users/ or /home/ paths
            hardcoded=$(grep -c '/Users/\|/home/' "$file" 2>/dev/null || true)
            if [ "$hardcoded" -gt 0 ]; then
              echo "⚠ $file: has hardcoded paths (use \$CLAUDE_PROJECT_DIR instead)"
            fi
          done

          echo "✓ All env vars checked"

          if [ "$failed" -eq 1 ]; then exit 1; fi

  validate-agent-parity:
    name: Validate Agent Parity (OpenCode ↔ Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check agent parity between OpenCode and Claude Code
        run: |
          echo "=== Checking Agent Parity ==="
          failed=0

          # Claude Code agents (without ciel.md — it's OpenCode-only orchestrator)
          CLAUDE_AGENTS="ciel-researcher ciel-explorer ciel-critic ciel-improver"

          # OpenCode subagents (without ciel.md — it's the orchestrator)
          OPENCODE_AGENTS="ciel-researcher ciel-explorer ciel-critic ciel-improver"

          # Check each agent exists in both harnesses
          for agent in ciel-researcher ciel-explorer ciel-critic ciel-improver; do
            if [ ! -f ".opencode/agents/${agent}.md" ]; then
              echo "✗ .opencode/agents/${agent}.md missing"
              failed=1
            fi
            if [ ! -f ".claude/agents/${agent}.md" ]; then
              echo "✗ .claude/agents/${agent}.md missing"
              failed=1
            fi
          done

          # Check that agent descriptions are present in both
          for agent in $CLAUDE_AGENTS; do
            oc_desc=$(grep "^description:" ".opencode/agents/${agent}.md" 2>/dev/null | head -1)
            cc_desc=$(grep "^description:" ".claude/agents/${agent}.md" 2>/dev/null | head -1)
            if [ -z "$oc_desc" ]; then
              echo "⚠ .opencode/agents/${agent}.md: missing description"
            fi
            if [ -z "$cc_desc" ]; then
              echo "⚠ .claude/agents/${agent}.md: missing description"
            fi
          done

          echo "✓ Agent parity check complete"
          if [ "$failed" -eq 1 ]; then exit 1; fi

  validate-skills:
    name: Validate Skills (YAML + size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate YAML frontmatter + line count
        run: |
          echo "=== Validating Skills ==="
          failed=0
          for skill in skills/*/SKILL.md; do
            [ ! -f "$skill" ] && continue
            name=$(basename "$(dirname "$skill")")
            # Check YAML frontmatter (--- at start)
            if ! head -1 "$skill" | grep -q '^---$'; then
              echo "✗ $name: missing opening ---"
              failed=1; continue
            fi
            # Check closing ---
            if ! grep -q '^---$' <(tail -n +2 "$skill" | head -20); then
              echo "✗ $name: missing closing ---"
              failed=1; continue
            fi
            # Check description
            if ! grep -q '^description:' "$skill"; then
              echo "✗ $name: missing description"
              failed=1; continue
            fi
            # Check line count ≤200 (format standard: Principe premier + 3 sections)
            lines=$(wc -l < "$skill")
            if [ "$lines" -gt 200 ]; then
              echo "✗ $name: $lines lines (max 200)"
              failed=1; continue
            fi
            echo "✓ $name: valid ($lines lines)"
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "✓ All skills valid"

  validate-plugin-size:
    name: Validate Plugin Size (≤65KB)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check OpenCode plugin size
        run: |
          if [ -f ".opencode/plugins/ciel.ts" ]; then
            size=$(wc -c < ".opencode/plugins/ciel.ts")
            if [ "$size" -le 65536 ]; then
              echo "✓ ciel.ts: $size bytes (≤65536)"
            else
              echo "✗ ciel.ts: $size bytes exceeds 65536 limit"
              exit 1
            fi
          else
            echo "⚠ ciel.ts not found"
          fi

      - name: Check CLAUDE.md size
        run: |
          if [ -f "CLAUDE.md" ]; then
            size=$(wc -c < "CLAUDE.md")
            echo "✓ CLAUDE.md: $size bytes"
          fi

  test-install:
    name: Test npm Install & CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build package
        working-directory: packages/ciel
        run: npm run build

      - name: Pack the package
        working-directory: packages/ciel
        run: |
          PACKFILE=$(npm pack 2>/dev/null | tail -1)
          echo "PACKFILE=$PACKFILE" >> $GITHUB_ENV
          echo "✓ Packed: $PACKFILE ($(wc -c < "$PACKFILE") bytes)"

      - name: Create test project and install
        run: |
          TEST_DIR=$(mktemp -d)
          echo "TEST_DIR=$TEST_DIR" >> $GITHUB_ENV
          cp "packages/ciel/$PACKFILE" "$TEST_DIR/"
          cd "$TEST_DIR"
          npm init -y > /dev/null 2>&1
          npm install "./$PACKFILE" 2>&1 | tail -3
          echo "✓ Installed in $TEST_DIR"

      - name: Test CLI — version
        run: |
          echo "=== CLI: --version ==="
          VERSION=$("$TEST_DIR/node_modules/.bin/ciel" --version 2>&1 || true)
          echo "Version output: $VERSION"
          [ -n "$VERSION" ] && echo "✓ CLI outputs version" || (echo "✗ No version output" && exit 1)

      - name: Test CLI — help
        run: |
          echo "=== CLI: --help ==="
          HELP=$("$TEST_DIR/node_modules/.bin/ciel" --help 2>&1 || true)
          echo "$HELP" | head -5
          echo "$HELP" | grep -qi "usage\|help\|ciel" && \
            echo "✓ CLI outputs help" || \
            (echo "✗ No help output" && exit 1)

      - name: Verify essential files installed
        run: |
          echo "=== Verifying installed files ==="
          failed=0
          for f in \
            node_modules/@neikyun/ciel/dist/plugin/index.js \
            node_modules/@neikyun/ciel/bin/ciel.js \
            node_modules/@neikyun/ciel/scripts/postinstall.cjs \
            node_modules/@neikyun/ciel/package.json; do
            if [ -f "$TEST_DIR/$f" ]; then
              echo "✓ $f"
            else
              echo "✗ $f missing"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "✓ All essential files present" || exit 1

      - name: Verify no missing agent files via CLI
        run: |
          echo "=== CLI: agent listing ==="
          # Simulate opencode.json + .opencode/ to check detection
          mkdir -p "$TEST_DIR/.opencode/agents"
          "$TEST_DIR/node_modules/.bin/ciel" --help 2>&1 | head -10
          echo "✓ CLI smoke test passed"

      - name: Cleanup
        run: rm -rf "$TEST_DIR"

  install-coverage:
    name: Validate Install Coverage (commands + hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Run install coverage test
        run: |
          echo "Verifying every commands/*.md and hooks/* is referenced in install scripts."
          echo "Catches the bug class where a new command/hook is added but install.sh"
          echo "copy-loops are forgotten — file present in source, absent from installed projects."
          echo ""
          bash scripts/test-install-coverage.sh

      - name: Verify mirror parity (commands, hooks, skills/ciel)
        run: |
          echo "Catches the foot-gun where a command is added to commands/ but forgotten"
          echo "in .opencode/commands/ or assets mirrors, or a hook drifts from its source."
          echo ""
          bash scripts/sync-mirrors.sh --check

  consistency:
    name: Consistency (canonical src/ + version + build tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          set-safe-directory: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # bin/ciel.js loads dist/ — built so the memory-save test exercises the real CLI.
      - name: Build dist
        working-directory: packages/ciel
        run: npx tsc

      # Mirrors (.claude/*, .opencode/*) are gitignored — regenerate from canonical src/.
      - name: Regenerate mirrors from canonical src/
        run: node scripts/build.mjs

      # REAL drift gate: the COMMITTED npm assets owned by build.mjs must match
      # what src/ produces. If src changed without rebuilding+committing assets,
      # this fails. (Gitignored local mirrors can't be diffed — build.test covers them.)
      - name: Gate — committed assets match canonical src/
        run: git diff --exit-code -- packages/ciel/assets/skills packages/ciel/assets/.claude/hooks packages/ciel/assets/.claude/rules

      # Hard gate: version files == VERSION, and every mirror matches src/ (byte + exec-bit).
      - name: Consistency doctor
        run: node scripts/doctor.mjs

      - name: Build / doctor / memory-save tests
        run: node --test test/build.test.mjs test/doctor.test.mjs test/memory-save.test.mjs
