# Release Please — Automated release PRs + GitHub Releases
# Déclencheur: push sur main
# Crée/maintient une Release PR qui bump la version + CHANGELOG
# Quand mergée → GitHub Release + tag v* + déclenche publish via dispatch
#
# Note: GITHUB_TOKEN ne déclenche PAS de workflows downstream.
# On dispatch donc publish manuellement après la release.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Dispatch publish workflow
        run: |
          gh workflow run "Publish NPM" \
            --repo ${{ github.repository }} \
            --ref main \
            -f dry-run=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
