# Release Please — Automated release PRs + GitHub Releases
# Déclencheur: push sur main
# Crée/maintient une Release PR qui bump la version + CHANGELOG
# Quand mergée → GitHub Release + tag v* + synchro VERSION + dispatch publish
#
# Note: GITHUB_TOKEN ne déclenche PAS de workflows downstream.
# On dispatch donc publish manuellement après la release.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  sync-version:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Sync distribution version files
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          echo "Syncing distribution files to v$VERSION"
          echo "$VERSION" > VERSION
          sed -i "s/CIEL_VERSION=\"[0-9.]*\"/CIEL_VERSION=\"$VERSION\"/" scripts/install.sh
          sed -i "s/CIEL v[0-9]*\.[0-9]*\.[0-9]*/CIEL v$VERSION/" hooks/session-start.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION scripts/install.sh hooks/session-start.sh
          git commit -m "chore: sync distribution files to v$VERSION" || echo "No changes to commit"
          git push origin main

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - name: Dispatch publish workflow
        run: |
          gh workflow run "Publish NPM" \
            --repo ${{ github.repository }} \
            --ref main \
            -f dry-run=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
