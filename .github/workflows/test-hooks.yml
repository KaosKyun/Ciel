# Test des hooks Ciel (v9)
# Déclencheur: push sur hooks/** + PR
# Note: les hooks canoniques vivent dans hooks/ (tracké). .claude/hooks/ est
# gitignoré (install local), donc absent du checkout CI — on teste hooks/.

name: Test Hooks

on:
  push:
    paths:
      - 'hooks/**'
  pull_request:
    paths:
      - 'hooks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-ciel-hooks:
    name: Test Ciel Hooks (hooks/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup test environment
        run: |
          # jq — required by track-file.sh for JSON input parsing
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          echo "CIEL_TEST_DIR=/tmp/ciel-hooks-test" >> $GITHUB_ENV
          mkdir -p /tmp/ciel-hooks-test/.ciel /tmp/ciel-hooks-test/src
          echo "[]" > /tmp/ciel-hooks-test/.ciel/tracked-files.json

      - name: Test block-destructive.sh (rm -rf → blocked)
        run: |
          echo "=== block-destructive: rm -rf ==="
          echo '{"tool_input": {"command": "rm -rf /important"}}' | \
            bash hooks/block-destructive.sh 2>&1 | grep -q "blocked" && \
            echo "✓ Blocks rm -rf" || \
            (echo "✗ Should have blocked rm -rf" && exit 1)

      - name: Test block-destructive.sh (safe command → allows)
        run: |
          echo "=== block-destructive: safe command ==="
          echo '{"tool_input": {"command": "ls -la"}}' | \
            bash hooks/block-destructive.sh 2>/dev/null && \
            echo "✓ Allows safe command" || \
            (echo "✗ Should have allowed safe command" && exit 1)

      - name: Test track-file.sh (tracks + deduplicates)
        run: |
          echo "=== track-file: track + dedup ==="
          for _ in 1 2; do
            echo '{"tool_input": {"file_path": "src/useWebSocket.ts"}}' | \
              CLAUDE_PROJECT_DIR=/tmp/ciel-hooks-test bash hooks/track-file.sh
          done
          COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/ciel-hooks-test/.ciel/tracked-files.json'))))")
          [ "$COUNT" -eq 1 ] && echo "✓ Tracks + deduplicates (count: $COUNT)" || \
            (echo "✗ Expected count 1, got $COUNT" && exit 1)

      - name: Test track-file.sh (logic edit writes last-code-edit)
        run: |
          echo "=== track-file: last-code-edit marker ==="
          echo '{"tool_input": {"file_path": "src/service.ts"}}' | \
            CLAUDE_PROJECT_DIR=/tmp/ciel-hooks-test bash hooks/track-file.sh
          [ -f /tmp/ciel-hooks-test/.ciel/last-code-edit ] && \
            echo "✓ Wrote .ciel/last-code-edit" || \
            (echo "✗ Should have written last-code-edit for a .ts edit" && exit 1)

      - name: Test track-verification.sh (test run writes last-verification)
        run: |
          echo "=== track-verification: records test run ==="
          echo '{"tool_input": {"command": "npm test"}}' | \
            CLAUDE_PROJECT_DIR=/tmp/ciel-hooks-test bash hooks/track-verification.sh
          [ -f /tmp/ciel-hooks-test/.ciel/last-verification ] && \
            echo "✓ Wrote .ciel/last-verification on a test run" || \
            (echo "✗ Should have recorded verification" && exit 1)

      - name: Test track-verification.sh (non-test command → no marker)
        run: |
          echo "=== track-verification: ignores non-test ==="
          rm -f /tmp/ciel-hooks-test/.ciel/last-verification
          echo '{"tool_input": {"command": "ls -la"}}' | \
            CLAUDE_PROJECT_DIR=/tmp/ciel-hooks-test bash hooks/track-verification.sh
          [ ! -f /tmp/ciel-hooks-test/.ciel/last-verification ] && \
            echo "✓ Silent on non-test command" || \
            (echo "✗ Should NOT have recorded verification" && exit 1)

      - name: Test pre-agent-gate.sh (research dispatch writes .ciel/dispatched)
        run: |
          echo "=== pre-agent-gate: dispatch marker ==="
          rm -f /tmp/ciel-hooks-test/.ciel/dispatched
          echo '{"tool_input": {"subagent_type": "ciel-researcher", "prompt": "x"}}' | \
            CLAUDE_PROJECT_DIR=/tmp/ciel-hooks-test bash hooks/pre-agent-gate.sh
          [ -f /tmp/ciel-hooks-test/.ciel/dispatched ] && \
            echo "✓ Wrote .ciel/dispatched for ciel-researcher" || \
            (echo "✗ Should have written dispatch marker" && exit 1)
