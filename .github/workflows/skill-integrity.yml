# Validation de l'intégrité des skills Ciel
# Déclencheur: push sur skills/**

name: Skill Integrity

on:
  push:
    paths:
      - 'skills/**'
  pull_request:
    paths:
      - 'skills/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-skill-yaml:
    name: Validate Skill YAML Frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate all SKILL.md files
        run: |
          echo "=== Validating Skill YAML Frontmatter ==="
          
          failed=0
          for skill in skills/*/SKILL.md; do
            if [ ! -f "$skill" ]; then
              echo "✗ $skill not found"
              failed=1
              continue
            fi
            
            # Check for YAML frontmatter (--- at start)
            if ! head -1 "$skill" | grep -q '^---$'; then
              echo "✗ $skill: Missing opening ---"
              failed=1
              continue
            fi
            
            # Check for closing ---
            if ! grep -q '^---$' <(tail -n +2 "$skill" | head -20); then
              echo "✗ $skill: Missing closing ---"
              failed=1
              continue
            fi
            
            # Check for required fields
            if ! grep -q '^description:' "$skill"; then
              echo "✗ $skill: Missing 'description:' field"
              failed=1
              continue
            fi
            
            echo "✓ $skill: Valid frontmatter"
          done
          
          if [ $failed -eq 1 ]; then
            echo "✗ Some skills have invalid frontmatter"
            exit 1
          fi
          
          echo "✓ All skills have valid YAML frontmatter"

  validate-skill-size:
    name: Validate Skill Size (≤500 lines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check skill line counts
        run: |
          echo "=== Validating Skill Sizes ==="
          
          failed=0
          for skill in skills/*/SKILL.md; do
            if [ ! -f "$skill" ]; then
              continue
            fi
            
            lines=$(wc -l < "$skill")
            if [ "$lines" -le 500 ]; then
              echo "✓ $(basename $(dirname $skill)): $lines lines (≤500)"
            else
              echo "✗ $(basename $(dirname $skill)): $lines lines exceeds 500 limit"
              failed=1
            fi
          done
          
          if [ $failed -eq 1 ]; then
            echo "✗ Some skills exceed 500 lines"
            exit 1
          fi
          
          echo "✓ All skills are ≤500 lines"

  validate-skill-urls:
    name: Validate Skill URLs (No 404)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install lychee (link checker)
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/v0.14.3/lychee-v0.14.3-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          mv /tmp/lychee /usr/local/bin/
          lychee --version

      - name: Validate URLs with lychee
        run: |
          echo "=== Validating Skill URLs ==="
          
          # Validate all URLs in skills directory
          # --no-progress: hide progress bar
          # --exclude: skip localhost and file:// URLs
          # --timeout: 20 seconds per URL
          # --max-retries: 2 retries per URL
          lychee --no-progress \
            --exclude '^file://' \
            --exclude 'localhost' \
            --timeout 20 \
            --max-retries 2 \
            --verbose \
            'skills/**/*.md' || {
              echo "✗ Some URLs are broken (see above)"
              exit 1
            }
          
          echo "✓ All URLs validated successfully"

  validate-skill-examples:
    name: Validate Skill Examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for examples in skills
        run: |
          echo "=== Validating Skill Examples ==="
          
          # Count skills with examples
          with_examples=0
          total=0
          
          for skill in skills/*/SKILL.md; do
            if [ ! -f "$skill" ]; then
              continue
            fi
            
            total=$((total + 1))
            
            # Check for code examples (``` blocks)
            if grep -q '```' "$skill"; then
              with_examples=$((with_examples + 1))
            fi
          done
          
          echo "Skills with examples: $with_examples/$total"
          
          # At least 50% should have examples
          threshold=$((total / 2))
          if [ "$with_examples" -ge "$threshold" ]; then
            echo "✓ Sufficient skills have examples (≥50%)"
          else
            echo "⚠ Less than 50% of skills have examples"
          fi

  validate-skill-references:
    name: Validate Skill References
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check reference.md files
        run: |
          echo "=== Validating Skill References ==="
          
          for dir in skills/*/; do
            if [ -f "${dir}reference.md" ]; then
              size=$(wc -l < "${dir}reference.md")
              echo "✓ $(basename $dir)/reference.md: $size lines"
            fi
          done
          
          echo "✓ Reference files validated"
