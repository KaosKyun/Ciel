# Validation des platforms Ciel
# Déclencheur: push sur platforms/** + PR

name: Platform Validation

on:
  push:
    paths:
      - 'platforms/**'
  pull_request:
    paths:
      - 'platforms/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-cursor:
    name: Validate Cursor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Cursor rules
        run: |
          echo "=== Validating Cursor ==="
          if [ -f "platforms/cursor/.cursor/rules/ciel.mdc" ]; then
            size=$(wc -c < "platforms/cursor/.cursor/rules/ciel.mdc")
            echo "Size: $size bytes"
            if [ "$size" -le 6144 ]; then
              echo "✓ Cursor rules: $size bytes (≤6144)"
            else
              echo "✗ Cursor rules: $size bytes exceeds 6144 limit"
              exit 1
            fi
          else
            echo "✗ Cursor rules file not found"
            exit 1
          fi

  validate-windsurf:
    name: Validate Windsurf
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Windsurf rules
        run: |
          echo "=== Validating Windsurf ==="
          
          # Check rules directory
          if [ ! -d "platforms/windsurf/.windsurf/rules" ]; then
            echo "✗ Windsurf rules directory not found"
            exit 1
          fi
          
          # Check each rule file ≤6KB
          total_size=0
          for f in platforms/windsurf/.windsurf/rules/*.md; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              total_size=$((total_size + size))
              if [ "$size" -le 6144 ]; then
                echo "✓ $(basename $f): $size bytes (≤6144)"
              else
                echo "✗ $(basename $f): $size bytes exceeds 6144 limit"
                exit 1
              fi
            fi
          done
          
          # Check total rules ≤12KB
          total_kb=$((total_size / 1024))
          echo "Total rules size: $total_kb KB"
          if [ "$total_size" -le 12288 ]; then
            echo "✓ Total rules: $total_size bytes (≤12288)"
          else
            echo "✗ Total rules: $total_size bytes exceeds 12288 limit"
            exit 1
          fi

  validate-codex:
    name: Validate Codex
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Codex AGENTS.md
        run: |
          echo "=== Validating Codex ==="
          
          if [ -f "platforms/codex/AGENTS.md" ]; then
            size=$(wc -c < "platforms/codex/AGENTS.md")
            echo "AGENTS.md size: $size bytes"
            if [ "$size" -le 32768 ]; then
              echo "✓ Codex AGENTS.md: $size bytes (≤32768)"
            else
              echo "✗ Codex AGENTS.md: $size bytes exceeds 32768 limit"
              exit 1
            fi
          else
            echo "✗ Codex AGENTS.md not found"
            exit 1
          fi
          
          # Check hooks.json if exists
          if [ -f "platforms/codex/.codex/hooks.json" ]; then
            jq '.' "platforms/codex/.codex/hooks.json" > /dev/null && \
              echo "✓ Codex hooks.json is valid JSON" || \
              (echo "✗ Codex hooks.json is invalid" && exit 1)
          fi

  validate-opencode:
    name: Validate OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TypeScript validation has known issues with @opencode-ai/plugin types (non-blocking)
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .opencode/package-lock.json

      - name: Install dependencies
        working-directory: .opencode
        run: npm ci

      - name: Check OpenCode structure
        run: |
          echo "=== Validating OpenCode Structure ==="
          
          # Check plugin file
          if [ -f "platforms/opencode/.opencode/plugins/ciel.ts" ]; then
            size=$(wc -c < "platforms/opencode/.opencode/plugins/ciel.ts")
            echo "Plugin size: $size bytes"
            if [ "$size" -le 65536 ]; then
              echo "✓ Plugin: $size bytes (≤65536)"
            else
              echo "✗ Plugin: $size bytes exceeds 65536 limit"
              exit 1
            fi
          else
            echo "✗ Plugin file not found"
            exit 1
          fi
          
          # Check agents directory
          if [ -d "platforms/opencode/.opencode/agents" ]; then
            count=$(ls -1 "platforms/opencode/.opencode/agents" | wc -l)
            echo "✓ Agents: $count files"
          else
            echo "✗ Agents directory not found"
            exit 1
          fi
          
          # Check commands directory
          if [ -d "platforms/opencode/.opencode/commands" ]; then
            count=$(ls -1 "platforms/opencode/.opencode/commands" | wc -l)
            echo "✓ Commands: $count files"
          else
            echo "✗ Commands directory not found"
            exit 1
          fi

      - name: Validate TypeScript syntax
        run: |
          echo "=== Validating TypeScript Syntax ==="
          # Use TypeScript from .opencode directory where it's installed
          # Use --ignoreConfig to avoid tsconfig.json conflict when specifying files
          cd .opencode
          npx tsc --noEmit --ignoreConfig ../platforms/opencode/.opencode/plugins/ciel.ts
          echo "✓ TypeScript validation passed"

  validate-kilocode:
    name: Validate Kilocode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Kilocode rules
        run: |
          echo "=== Validating Kilocode ==="
          
          if [ -f "platforms/kilocode/.kilocode/rules/ciel.md" ]; then
            size=$(wc -c < "platforms/kilocode/.kilocode/rules/ciel.md")
            echo "Rules size: $size bytes"
            if [ "$size" -le 6144 ]; then
              echo "✓ Kilocode rules: $size bytes (≤6144)"
            else
              echo "✗ Kilocode rules: $size bytes exceeds 6144 limit"
              exit 1
            fi
          else
            echo "✗ Kilocode rules file not found"
            exit 1
          fi
          
          # Check .kilo directory if exists
          if [ -d "platforms/kilocode/.kilo" ]; then
            echo "✓ .kilo directory exists"
          fi

  validate-ollama:
    name: Validate Ollama
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Ollama Modelfile
        run: |
          echo "=== Validating Ollama ==="
          
          if [ -f "platforms/ollama/Modelfile" ]; then
            # Basic syntax check - Modelfile should have FROM and SYSTEM
            if grep -q "^FROM" "platforms/ollama/Modelfile"; then
              echo "✓ Modelfile has FROM directive"
            else
              echo "✗ Modelfile missing FROM directive"
              exit 1
            fi
            
            if grep -q "^SYSTEM" "platforms/ollama/Modelfile"; then
              echo "✓ Modelfile has SYSTEM directive"
            else
              echo "✗ Modelfile missing SYSTEM directive"
              exit 1
            fi
            
            size=$(wc -c < "platforms/ollama/Modelfile")
            echo "✓ Modelfile: $size bytes"
          else
            echo "✗ Modelfile not found"
            exit 1
          fi

  validate-lmstudio:
    name: Validate LM Studio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check LM Studio files
        run: |
          echo "=== Validating LM Studio ==="
          
          # Check preset.json
          if [ -f "platforms/lmstudio/ciel.preset.json" ]; then
            jq '.' "platforms/lmstudio/ciel.preset.json" > /dev/null && \
              echo "✓ ciel.preset.json is valid JSON" || \
              (echo "✗ ciel.preset.json is invalid" && exit 1)
          else
            echo "✗ ciel.preset.json not found"
            exit 1
          fi
          
          # Check system-prompt.md
          if [ -f "platforms/lmstudio/system-prompt.md" ]; then
            size=$(wc -c < "platforms/lmstudio/system-prompt.md")
            echo "✓ system-prompt.md: $size bytes"
          else
            echo "✗ system-prompt.md not found"
            exit 1
          fi
