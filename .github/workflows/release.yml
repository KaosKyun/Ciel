# Release automatique sur tag
# Déclencheur: tag v*
# Utilise matrix-build.yml pour le build parallèle

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: Build Multi-Platforms (Matrix)
    uses: ./.github/workflows/matrix-build.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Download all platform artifacts
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          pattern: ciel-*-${{ steps.get_version.outputs.version }}
          merge-multiple: true
          path: ./packages

      - name: Verify artifact integrity (SHA256)
        run: |
          echo "=== Verifying artifact integrity ==="
          
          # List all downloaded artifacts
          ls -la ./packages/
          
          # Verify each artifact has a valid SHA256 hash
          for file in ./packages/*.tar.gz; do
            if [ -f "$file" ]; then
              hash=$(sha256sum "$file" | cut -d' ' -f1)
              echo "✓ $(basename $file): $hash"
            fi
          done
          
          echo "✓ All artifacts verified"

      - name: Generate release notes
        id: release_notes
        run: |
          echo "Generating release notes from CHANGELOG.md..."
          
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk '/^## \[/ {if (found) exit; found=1} found' CHANGELOG.md | head -50)
            if [ -z "$NOTES" ]; then
              NOTES="Release ${{ steps.get_version.outputs.version }}"
            fi
          else
            NOTES="Release ${{ steps.get_version.outputs.version }}"
          fi
          
          echo "$NOTES" > /tmp/release-notes.md
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564 # v2.0.4
        with:
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          files: |
            packages/*.tar.gz
          generate_release_notes: true
          
      - name: Generate SBOM
        run: |
          echo "Generating SBOM for release..."
          
          # Create simple SBOM
          cat > sbom.json << EOF
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "version": 1,
            "metadata": {
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "tools": [
                {
                  "name": "github-actions",
                  "version": "${{ github.run_id }}"
                }
              ],
              "component": {
                "type": "application",
                "name": "Ciel",
                "version": "${{ steps.get_version.outputs.version }}"
              }
            },
            "components": [
              {
                "type": "library",
                "name": "@opencode-ai/plugin",
                "version": "1.4.9"
              },
              {
                "type": "library",
                "name": "typescript",
                "version": "5.5.x"
              }
            ]
          }
          EOF
          
          echo "✓ SBOM generated"
          
      - name: Upload SBOM
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-${{ steps.get_version.outputs.version }}
          path: sbom.json
          retention-days: 90

      - name: Verify release
        run: |
          echo "=== Release Verification ==="
          echo "Version: ${{ steps.get_version.outputs.version }}"
          echo "Tag: ${GITHUB_REF#refs/tags/}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }}"
          echo ""
          echo "✓ Release published successfully"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, publish]
    if: always()
    steps:
      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Notification (simulated)
        run: |
          echo "=== Release Notification ==="
          echo "Version: v${{ steps.get_version.outputs.version }}"
          echo "Status: ${{ needs.publish.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo ""
          echo "In production, this would:"
          echo "  - Send Discord webhook notification"
          echo "  - Post to Twitter/X"
          echo "  - Update documentation site"
          echo "  - Notify maintainers via email"
          echo "==============================="
