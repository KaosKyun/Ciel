# Release automatique sur tag
# Déclencheur: tag v*

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .opencode/package-lock.json

      - name: Install dependencies
        working-directory: .opencode
        run: npm ci

      - name: Build for all platforms
        run: |
          echo "Building Ciel for all platforms..."
          chmod +x scripts/build-platforms.sh
          ./scripts/build-platforms.sh --target=all

      - name: Create platform packages
        run: |
          mkdir -p build/packages
          for platform in cursor windsurf codex opencode kilocode ollama lmstudio; do
            if [ -d "platforms/$platform" ]; then
              tar -czf "build/packages/ciel-${platform}-${{ steps.get_version.outputs.version }}.tar.gz" \
                -C "platforms/$platform" .
              echo "✓ Created ciel-${platform}-${{ steps.get_version.outputs.version }}.tar.gz"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ciel-release-${{ steps.get_version.outputs.version }}
          path: build/packages/
          retention-days: 30

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: ciel-release-${{ steps.get_version.outputs.version }}
          path: ./packages

      - name: Generate release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## \[/ {if (found) exit; found=1} found' CHANGELOG.md | head -50 > /tmp/release-notes.md
          else
            echo "Release ${{ steps.get_version.outputs.version }}" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564 # v2.0.4
        with:
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: /tmp/release-notes.md
          files: packages/*.tar.gz
          generate_release_notes: true
